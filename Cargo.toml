[package]
name = "shinbun"
version = "0.2.1"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
chrono = "0.4.44"
clap = { version = "4", features = ["derive"] }
quick-xml = "0.41"
crossterm = "0.29.0"
dirs = "6.0.0"
feed-rs = "2.1.0"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
ratatui-image = { version = "11", default-features = false, features = ["crossterm"] }
arboard = "3.6.1"
open = "5.3.3"
ratatui = "0.30.0"
reqwest = "0.13.2"
rusqlite = "0.38.0"
serde = { version = "1.0.204", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.40.0", features = ["rt", "rt-multi-thread", "process", "macros"] }
toml = "0.9.8"
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["simd"] }
scraper = "0.27.0"
ego-tree = "0.11.0"

[dev-dependencies]
tempfile = "3"
