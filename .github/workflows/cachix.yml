name: Cachix

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  cache:
    name: Build & push to Cachix
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'Moskas/shinbun' }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: moskas
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - run: nix build .#default --fallback

  push:
    name: Update cachix branch
    needs: cache
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fast-forward cachix branch to this commit
        run: |
          git fetch origin master origin/cachix 2>/dev/null || true
          git merge-base --is-ancestor "${{ github.sha }}" origin/master || exit 0
          git merge-base --is-ancestor "${{ github.sha }}" origin/cachix 2>/dev/null && exit 0
          git push origin "${{ github.sha }}":refs/heads/cachix --force
